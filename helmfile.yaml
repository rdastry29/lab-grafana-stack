# =============================================================================
# helmfile.yaml — Lab Grafana Stack (LGTM + OpenTelemetry Demo)
#
# Uso:
#   helmfile repos                          # Adiciona/atualiza os repos Helm
#   helmfile apply                          # Deploy de tudo
#   helmfile apply -l component=grafana-stack  # Só a Grafana Stack
#   helmfile apply -l component=otel-demo      # Só o OTel Demo
#   helmfile diff                           # Ver o que mudaria antes de aplicar
#   helmfile destroy                        # Remove tudo (cuidado!)
# =============================================================================

repositories:
  # Grafana — Alloy, Mimir, Tempo, Loki, Grafana
  - name: grafana
    url: https://grafana.github.io/helm-charts

  # OpenTelemetry — Demo App
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts

---

releases:

  # ---------------------------------------------------------------------------
  # 1. LOKI — Armazenamento de Logs
  #    Chart: grafana/loki
  #    Docs:  https://grafana.com/docs/loki/latest/setup/install/helm/
  # ---------------------------------------------------------------------------
  - name: loki
    namespace: grafana-stack
    chart: grafana/loki
    version: "6.30.1"
    labels:
      component: grafana-stack
      tier: storage
    values:
      - values/loki.yaml

  # ---------------------------------------------------------------------------
  # 2. TEMPO — Armazenamento de Traces Distribuídos
  #    Chart: grafana/tempo
  #    Docs:  https://grafana.com/docs/tempo/latest/setup/helm-chart/
  # ---------------------------------------------------------------------------
  - name: tempo
    namespace: grafana-stack
    chart: grafana/tempo
    version: "1.21.1"
    labels:
      component: grafana-stack
      tier: storage
    values:
      - values/tempo.yaml

  # ---------------------------------------------------------------------------
  # 3. MIMIR — Armazenamento de Métricas (Prometheus-compatível)
  #    Chart: grafana/mimir-distributed
  #    Docs:  https://grafana.com/docs/mimir/latest/setup/deploy-grafana-mimir-with-helm/
  #    Nota:  Usamos 'mimir-distributed' mesmo em modo monolítico para ter
  #           acesso a todos os valores de configuração fine-grained.
  # ---------------------------------------------------------------------------
  - name: mimir
    namespace: grafana-stack
    chart: grafana/mimir-distributed
    version: "5.7.0"
    labels:
      component: grafana-stack
      tier: storage
    values:
      - values/mimir.yaml

  # ---------------------------------------------------------------------------
  # 4. ALLOY — Agente/Collector de Telemetria (substitui Prometheus Agent +
  #    Promtail + OTel Collector em um binário único)
  #    Chart: grafana/alloy
  #    Docs:  https://grafana.com/docs/alloy/latest/set-up/deploy/kubernetes/
  # ---------------------------------------------------------------------------
  - name: alloy
    namespace: grafana-stack
    chart: grafana/alloy
    version: "0.12.6"
    labels:
      component: grafana-stack
      tier: collector
    values:
      - values/alloy.yaml

  # ---------------------------------------------------------------------------
  # 5. GRAFANA — Dashboards, Explore e Alertas
  #    Chart: grafana/grafana
  #    Docs:  https://grafana.com/docs/grafana/latest/setup-grafana/installation/helm/
  # ---------------------------------------------------------------------------
  - name: grafana
    namespace: grafana-stack
    chart: grafana/grafana
    version: "8.11.4"
    labels:
      component: grafana-stack
      tier: frontend
    values:
      - values/grafana.yaml
    # Garante que os datasources (Loki, Tempo, Mimir) já existam antes
    needs:
      - grafana-stack/loki
      - grafana-stack/tempo
      - grafana-stack/mimir

  # ---------------------------------------------------------------------------
  # 6. OPENTELEMETRY DEMO — App de carga com 20+ microservices instrumentados
  #    Chart: open-telemetry/opentelemetry-demo
  #    Docs:  https://opentelemetry.io/docs/demo/kubernetes-deployment/
  #    Nota:  Desabilitamos os componentes internos (Grafana, Jaeger, Prometheus)
  #           pois usamos nossa própria stack.
  # ---------------------------------------------------------------------------
  - name: otel-demo
    namespace: otel-demo
    chart: open-telemetry/opentelemetry-demo
    version: "0.37.2"
    labels:
      component: otel-demo
    values:
      - values/otel-demo.yaml
    # O OTel Demo depende do Alloy estar rodando para receber os traces
    needs:
      - grafana-stack/alloy
