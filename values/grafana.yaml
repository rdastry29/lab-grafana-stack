# =============================================================================
# values/grafana.yaml — Configuração do Grafana para o Lab
#
# - Datasources provisionados automaticamente (Mimir, Tempo, Loki)
# - Correlações Trace→Logs e Logs→Trace configuradas
# - Sidecar para carregar dashboards de ConfigMaps automaticamente
# - Admin password: admin (mudar em produção!)
#
# Docs: https://grafana.com/docs/grafana/latest/setup-grafana/installation/helm/
# =============================================================================

# Credenciais de acesso
adminUser: admin
adminPassword: admin  # APENAS PARA LAB

# Persistência (salva dashboards criados manualmente)
persistence:
  enabled: true
  size: 5Gi

# Recursos
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Plugins adicionais (instalados automaticamente)
plugins:
  - grafana-clock-panel       # Relógio nos dashboards
  - grafana-piechart-panel    # Gráficos de pizza

# =============================================================================
# DATASOURCES — Provisionados via ConfigMap (sem precisar configurar na UI)
# =============================================================================
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:

      # -------------------------------------------------------------------------
      # Mimir — Métricas (Prometheus-compatible)
      # -------------------------------------------------------------------------
      - name: Mimir
        type: prometheus
        uid: mimir
        url: http://mimir-nginx.grafana-stack.svc.cluster.local/prometheus
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: "15s"
          # Habilita o Exemplars (link direto de métricas → trace)
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo

      # -------------------------------------------------------------------------
      # Tempo — Traces Distribuídos
      # -------------------------------------------------------------------------
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.grafana-stack.svc.cluster.local:3100
        access: proxy
        jsonData:
          # Link de trace → logs no Loki (correlação automática!)
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: "service.name"
                value: "app"
            filterByTraceID: true
            filterBySpanID: false
          # Habilita busca por serviço no Tempo
          serviceMap:
            datasourceUid: mimir
          # Span Metrics — gráficos RED a partir dos traces
          spanBar:
            type: "duration"
          # Habilita Node Graph (mapa de serviços visual)
          nodeGraph:
            enabled: true
          # Habilita search no Tempo
          search:
            hide: false

      # -------------------------------------------------------------------------
      # Loki — Logs
      # -------------------------------------------------------------------------
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.grafana-stack.svc.cluster.local
        access: proxy
        jsonData:
          # Link de logs → traces no Tempo (correlação automática!)
          derivedFields:
            - name: TraceID
              matcherRegex: '"traceID":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: "Ver Trace no Tempo"
          timeout: 60

# =============================================================================
# DASHBOARDS — Carregados automaticamente via sidecar
# =============================================================================
sidecar:
  dashboards:
    enabled: true
    # Carrega dashboards de qualquer ConfigMap com este label
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: "ALL"  # Busca em todos os namespaces
  datasources:
    enabled: true

# =============================================================================
# GRAFANA INI — Configurações avançadas
# =============================================================================
grafana.ini:
  server:
    root_url: "http://localhost:3000"
  # Habilitar unified alerting
  unified_alerting:
    enabled: true
  # Habilitar Explore (essencial para investigação de traces e logs)
  explore:
    enabled: true
  # Feature toggles para funcionalidades beta mas úteis
  feature_toggles:
    enable: "traceToMetrics,correlations,newTraceView"

# Service type ClusterIP (acesso via port-forward)
service:
  type: ClusterIP
  port: 80
