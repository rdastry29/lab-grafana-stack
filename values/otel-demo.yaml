# =============================================================================
# values/otel-demo.yaml — OpenTelemetry Demo App
#
# App de demonstração com 20+ microservices instrumentados com OTEL.
# Gera traces, métricas e logs reais para testar a stack de observabilidade.
#
# Estratégia: sobrescrever OTEL_COLLECTOR_NAME para apontar ao nosso Alloy
# em vez do collector interno do demo. Todos os serviços usam esta variável
# para compor o endpoint OTLP: http://$(OTEL_COLLECTOR_NAME):4318
#
# Componentes internos desabilitados (usamos nossa própria stack):
#   ❌ opentelemetry-collector interno  → Alloy (grafana-stack)
#   ❌ jaeger interno                   → Tempo (grafana-stack)
#   ❌ prometheus interno               → Mimir via Alloy (grafana-stack)
#   ❌ grafana interno                  → Grafana (grafana-stack)
#
# Docs: https://opentelemetry.io/docs/demo/kubernetes-deployment/
# =============================================================================

# =============================================================================
# DEFAULT ENV — aplicado a TODOS os microservices
# Sobrescreve o endpoint do collector para o nosso Alloy
# =============================================================================
default:
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    # ⭐ CHAVE: aponta todos os serviços para o Alloy no namespace grafana-stack
    - name: OTEL_COLLECTOR_NAME
      value: "alloy.grafana-stack.svc.cluster.local"
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: cumulative
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=2.0.2"

# =============================================================================
# COMPONENTES INTERNOS — todos desabilitados
# =============================================================================
opentelemetry-collector:
  enabled: false

jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

# =============================================================================
# COMPONENTES DA APP — nomes em kebab-case conforme schema do chart v0.37.x
# Recursos ajustados para M1 com 10 GB alocados no Colima.
# Total estimado: ~2.5 GB RAM para todos os serviços.
# =============================================================================
components:

  # Frontend: interface web da loja (React)
  frontend:
    resources:
      limits:
        memory: 250Mi

  # Proxy de entrada nginx
  frontend-proxy:
    resources:
      limits:
        memory: 64Mi
    service:
      type: ClusterIP

  # Load Generator: gera tráfego contínuo automaticamente
  load-generator:
    resources:
      limits:
        memory: 200Mi

  # Cart Service (Go) - usa Valkey/Redis
  cart:
    resources:
      limits:
        memory: 160Mi

  # Checkout Service (Go)
  checkout:
    resources:
      limits:
        memory: 128Mi

  # Product Catalog Service (Go)
  product-catalog:
    resources:
      limits:
        memory: 128Mi

  # Currency Service (C++)
  currency:
    resources:
      limits:
        memory: 128Mi

  # Shipping Service (Rust)
  shipping:
    resources:
      limits:
        memory: 128Mi

  # Email Service (Ruby)
  email:
    resources:
      limits:
        memory: 128Mi

  # Payment Service (JavaScript/Node.js)
  payment:
    resources:
      limits:
        memory: 128Mi

  # Recommendation Service (Python)
  recommendation:
    resources:
      limits:
        memory: 500Mi

  # Ad Service (Java) — ⭐ gera falhas simuladas via feature flags!
  ad:
    resources:
      limits:
        memory: 300Mi

  # Accounting Service (Go)
  accounting:
    resources:
      limits:
        memory: 128Mi

  # Fraud Detection Service (Kotlin/JVM)
  fraud-detection:
    resources:
      limits:
        memory: 300Mi

  # Image Provider (nginx serving product images)
  image-provider:
    resources:
      limits:
        memory: 64Mi

  # Quote Service (PHP)
  quote:
    resources:
      limits:
        memory: 128Mi

  # Kafka (message queue entre serviços)
  kafka:
    resources:
      limits:
        memory: 600Mi

  # Valkey (Redis-compatible) - backend do cartService
  valkey-cart:
    resources:
      limits:
        memory: 128Mi

  # Flag Daemon: controla feature flags (falhas simuladas)
  # ⭐ Use para simular erros e testar alertas!
  flagd:
    resources:
      limits:
        memory: 64Mi
