# =============================================================================
# values/mimir.yaml — Configuração do Mimir para o Lab
#
# Usando grafana/mimir-distributed v5.7.0 (Mimir 2.16.0) com configuração
# mínima: 1 réplica de cada componente, filesystem local, sem zonas.
#
# O mimir-distributed não tem modo single-binary como o Loki. Por isso,
# configuramos cada componente com 1 réplica e recursos mínimos.
#
# URLs resultantes:
#   Remote write: http://mimir-nginx.grafana-stack.svc/api/v1/push
#   Query:        http://mimir-nginx.grafana-stack.svc/prometheus
# =============================================================================

# Configuração principal do Mimir (Mimir 2.16.0 — campos corretos)
mimir:
  structuredConfig:
    # Multi-tenancy desligado para o lab
    multitenancy_enabled: false

    # Limites globais (sem retention_period aqui — vai no compactor)
    limits:
      ingestion_rate: 10000
      ingestion_burst_size: 200000
      max_global_series_per_user: 1500000

    # Compactor: define retenção via data_dir
    compactor:
      data_dir: /data/mimir/compactor

    # Ingester: replication_factor = 1 (sem HA no lab)
    ingester:
      ring:
        replication_factor: 1

    # Store-gateway: sem sharding no lab
    store_gateway:
      sharding_ring:
        replication_factor: 1

    # Storage: filesystem local
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/blocks
      tsdb:
        dir: /data/mimir/tsdb

    # Ruler storage (path separado do blocks_storage!)
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/ruler

# =============================================================================
# COMPONENTES — 1 réplica de cada, recursos mínimos
# =============================================================================

# Desabilitar zone-aware replication (não precisamos de zonas no lab)
ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistentVolume:
    enabled: true
    size: 10Gi

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  persistentVolume:
    enabled: true
    size: 10Gi

distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

query_scheduler:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

compactor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  persistentVolume:
    enabled: true
    size: 5Gi

# Ruler: desabilitado por ora (path conflict com blocks_storage)
ruler:
  enabled: false
  replicas: 0

overrides_exporter:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# =============================================================================
# NGINX — ponto único de entrada (remote_write + query)
# =============================================================================
nginx:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# =============================================================================
# COMPONENTES DESABILITADOS
# =============================================================================
minio:
  enabled: false

rollout_operator:
  enabled: false

alertmanager:
  enabled: false
  replicas: 0
